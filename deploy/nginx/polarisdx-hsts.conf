# AP26 PT26.1 — HSTS fuer den produktiven HTTPS-Origin (SECURITY-CONTRACT §5).
#
# Owner: Reverse Proxy (DEPLOYMENT-CONTRACT DEP-32/DEP-41). Die App setzt KEIN HSTS —
# sie kennt die TLS-Terminierung nicht und darf localhost/Dev nie unbrauchbar machen.
#
# Einbinden NUR im 443-Serverblock von polarisdx.net / www.polarisdx.net:
#     include /pfad/zum/repo/deploy/nginx/polarisdx-hsts.conf;
# Nicht im Port-80-Block (HSTS ueber HTTP ist wirkungslos), nicht fuer Preview/Staging.
#
# nginx-Vererbung: `add_header` im server-Block gilt NICHT in location-Bloecken, die eigene
# `add_header` setzen (produktiv z. B. die /early-Locations) — dort diese Datei erneut einbinden.
#
# Bewusst OHNE includeSubDomains: nicht jede Subdomain ist als reiner HTTPS-Dienst belegt.
# Bewusst OHNE preload: Preload ist eine eigene Operator-Entscheidung mit Domainpruefung
# (hstspreload.org) und praktisch nicht rueckholbar.
#
# Aktivierung (AP31 Operator-Check): erst kurze Laufzeit (z. B. max-age=86400) ausrollen,
# HTTPS-Erreichbarkeit aller Pfade pruefen, dann auf den Zielwert unten erhoehen.
add_header Strict-Transport-Security "max-age=31536000" always;
