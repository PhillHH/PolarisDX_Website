# PolarisDX — produktiver vhost polarisdx.net (Host-nginx), Zielstand Relaunch (AP31, 2026-10-16).
# Quelle: sites-enabled/polarisdx.net vom 2026-10-16 ohne die Early-Access-Locations (SC-004,
# docs/deploy.md §3) und mit HSTS (SECURITY-CONTRACT §4.1, Snippet deploy/nginx/polarisdx-hsts.conf
# nach /etc/nginx/snippets/ kopieren). Installation: docs/deploy.md §3 „Cutover".

# ----------------------------------------------------
# 1. HTTP (Port 80) auf HTTPS (Port 443) umleiten
# ----------------------------------------------------
server {
    listen 80;
    server_name polarisdx.net www.polarisdx.net;

    # Permanente Weiterleitung auf HTTPS
    return 301 https://$host$request_uri;
}

# ----------------------------------------------------
# 2. HTTPS (Port 443) Reverse-Proxy auf Docker-Frontend
# ----------------------------------------------------
server {
    listen 443 ssl http2;
    server_name polarisdx.net www.polarisdx.net;

    # SSL/TLS Zertifikate (Certbot)
    ssl_certificate /etc/letsencrypt/live/polarisdx.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polarisdx.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # AP31 (2026-10-16): HSTS am produktiven Origin (SECURITY-CONTRACT §4.1, DD-14/OA-1).
    # Snippet = Kopie von deploy/nginx/polarisdx-hsts.conf (Repo): max-age=31536000,
    # ohne includeSubDomains, ohne preload.
    include /etc/nginx/snippets/polarisdx-hsts.conf;

    # Relaunch (AP31, 2026-10-16): alles an den SSR-Dienst des Compose-Projekts 01polaris
    # (Release ueber ./deploy.sh im Arbeitsbaum /home/phillip/01polaris-preview). /api/*
    # laeuft durch den SSR-Proxy; /early ist in der App eine bewusste 404 (SC-004).
    location / {
        proxy_pass http://127.0.0.1:2026;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Zugriff auf versteckte Dateien blockieren
    location ~ /\. {
        deny all;
    }

    # Optional: Upload-Limit erhöhen, falls große Dateien hochgeladen werden sollen
    client_max_body_size 100M;
}
