# AP26 PT26.3 — Access-Log ohne Query-String.
#
# Warum: der geschuetzte Download `GET /api/content-download/asset/<id>?e=<entitlement>&t=<token>`
# traegt ein Token im Query-String. Das Standard-Format `combined` schreibt `$request` — also die
# vollstaendige URL — ins Access-Log; ein Log-Leser haette damit einen funktionierenden Link.
# Dieses Format schreibt `$uri` (Pfad ohne Query) statt `$request`. Kampagnen-Parameter entfallen
# damit ebenfalls aus dem Log (gewollt: weniger personenbeziehbare Daten).
#
# Einbinden (Operator, AP31/AP28, OA-8):
#   1. Diese Datei im http-Kontext laden, z. B. nach /etc/nginx/conf.d/ legen.
#   2. In JEDEM server-Block von polarisdx.net und preview.polarisdx.net:
#        access_log /var/log/nginx/access.log polarisdx_redacted;
#   3. Bestehende Access-Logs mit Tokens nach Aufbewahrungsregel entfernen (Operator).
#
# Rest-Risiko: nginx-Fehlerlogs nennen bei Upstream-Fehlern die Anfragezeile inklusive Query.
log_format polarisdx_redacted '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';
