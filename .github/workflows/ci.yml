name: CI

on:
  pull_request:
    branches: [main, feat/home-leadmagnet, 'console/**']
  push:
    branches: [main, feat/home-leadmagnet, 'console/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier --check .

      - name: Color/token guard
        run: npm run check:colors

      - name: Design-system changelog gate
        run: npm run check:ds-changelog

      - name: Shell i18n gate (10 Sprachen)
        run: npm run check:shell-i18n

      - name: G4 productive i18n parity gate
        run: npm run check:i18n

      - name: Navigation target gate
        run: npm run check:nav-targets

      - name: Search index target and i18n gate
        run: npm run check:search-index

      - name: Internal findability gate
        run: npm run check:internal-findability

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E smoke tests
        run: npx playwright test e2e/url-smoke.spec.ts
        env:
          CI: true

      - name: Design-system visual regression + interaction tests
        run: npx playwright test e2e/design-system.spec.ts
        env:
          CI: true

      - name: Navigation regression tests
        run: npx playwright test e2e/navigation.spec.ts
        env:
          CI: true

      - name: Search modal accessibility and interaction tests
        run: npx playwright test e2e/search-modal.spec.ts
        env:
          CI: true

      - name: Internal findability regression tests
        run: npx playwright test e2e/findability.spec.ts
        env:
          CI: true

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  routing:
    name: AP10 Routing and HTTP semantics gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: G1 Route Registry parity gate
        run: npm run check:routes

      - name: Build production SSR artifacts
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: G2 real HTTP 404 and G9 permanent redirect gates
        run: npm run check:http-status
        env:
          CI: true

  seo:
    name: AP09 SEO gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: G3 SEO artifact and meta-quality coverage
        run: npm run check:seo

      - name: SEOHead, sitemap and Structured Data unit tests
        run: >-
          npx vitest run
          src/components/seo/SEOHead.test.tsx
          src/components/seo/sitemap.test.ts
          src/components/seo/structuredData.test.ts

      - name: Build production SSR artifacts
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: SEO, Consumer, Structured Data and sitemap runtime regressions
        run: npx playwright test e2e/seo-head.spec.ts e2e/sitemap.spec.ts
        env:
          CI: true

      - name: Upload SEO traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seo-playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
