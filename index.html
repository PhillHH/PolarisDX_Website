<!doctype html>
<html lang="de">
  <head>
    <!-- ================================================================== -->
    <!-- BASIC META TAGS -->
    <!-- ================================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ================================================================== -->
    <!-- GOOGLE SITE VERIFICATION (Replace with your code) -->
    <!-- ================================================================== -->
    <meta name="google-site-verification" content="32dbwN77xqdzFz-VTni2JkGzTLaCp03gkm52vqi_1TQ" />

    <!-- Google providers are injected by the consent-gated client bootstrap. -->

    <!-- Primary Meta Tags (Fallback - SSR überschreibt diese via Helmet) -->
    <title>IglooPro POC-Reader | Point-of-Care Diagnostik | PolarisDX</title>
    <meta name="title" content="IglooPro POC-Reader | Point-of-Care Diagnostik | PolarisDX" />
    <meta
      name="description"
      content="Laborergebnisse in 3 Minuten — direkt in Ihrer Praxis. Der IglooPro POC-Reader für Dental, Longevity & Beauty. Jetzt beraten lassen."
    />
    <!--
      Hier stand ein globaler meta-keywords-Tag. Er war statisch und deutsch und
      wurde damit auf JEDER Seite JEDER Sprache ausgeliefert (nachgemessen u. a.
      auf /en/terms und /fr/). Google wertet das Signal seit Jahren nicht aus;
      auf neun nicht-deutschen Sprachversionen war es zudem sprachfremd.
      Seitenspezifische Keywords setzt weiterhin SEOHead per Helmet.
    -->
    <meta name="author" content="Polaris Diagnostics Europe GmbH" />
    <!--
      robots/googlebot sind hier NUR Fallback fuer den Fall, dass Helmet keine
      eigene Direktive rendert (Lazy-Chunk-Fallback). Sobald Helmet einen
      echten Titel liefert, entfernt server.ts diese beiden Tags aus dem
      Template. Ohne das trugen /imprint, /privacy und /terms zwei
      widersprüchliche robots-Angaben: hier "index, follow", per Helmet
      "noindex, nofollow" — Suchmaschinen nehmen die restriktivste.
      bingbot bleibt bewusst stehen: Helmet setzt dafuer kein Gegenstueck.
    -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <link rel="canonical" href="https://polarisdx.net/" />

    <!-- Language & Region -->
    <meta name="language" content="German" />
    <meta name="geo.region" content="DE" />
    <meta name="geo.placename" content="Hamburg" />

    <!-- ================================================================== -->
    <!-- OPEN GRAPH (Facebook, LinkedIn) -->
    <!-- ================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://polarisdx.net/" />
    <meta property="og:title" content="IglooPro POC-Reader | Point-of-Care Diagnostik" />
    <meta
      property="og:description"
      content="Laborergebnisse in 3 Minuten — direkt in Ihrer Praxis. Der IglooPro POC-Reader für Dental, Longevity & Beauty."
    />
    <meta property="og:image" content="https://polarisdx.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="IglooPro POC-Reader - Point-of-Care Diagnostik von PolarisDX"
    />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:site_name" content="PolarisDX" />

    <!-- ================================================================== -->
    <!-- TWITTER CARD -->
    <!-- ================================================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://polarisdx.net/" />
    <meta name="twitter:title" content="IglooPro POC-Reader | Point-of-Care Diagnostik" />
    <meta
      name="twitter:description"
      content="Laborergebnisse in 3 Minuten — direkt in Ihrer Praxis. Der IglooPro POC-Reader für Dental, Longevity & Beauty."
    />
    <meta name="twitter:image" content="https://polarisdx.net/og-image.jpg" />
    <meta name="twitter:image:alt" content="IglooPro POC-Reader von PolarisDX" />

    <!-- ================================================================== -->
    <!-- FAVICON & ICONS -->
    <!-- ================================================================== -->
    <!-- favicon.ico zuerst: Browser und Crawler fragen /favicon.ico ohne
         Link-Tag ab. Enthaelt 16-256px in einer Datei. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/polarisdx-mark.svg" />
    <!-- iOS komponiert Transparenz auf Schwarz — deshalb eigene Datei mit
         Navy-Hintergrund statt der transparenten Variante. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ================================================================== -->
    <!-- THEME & MOBILE -->
    <!-- ================================================================== -->
    <meta name="theme-color" content="#083358" />
    <meta name="msapplication-TileColor" content="#083358" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PolarisDX" />
    <meta name="application-name" content="PolarisDX" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- ================================================================== -->
    <!-- SSR HELMET HEAD INJECTION POINT -->
    <!-- ================================================================== -->
    <!--helmet-head-->
  </head>
  <body class="antialiased">
    <!-- React App Root - SSR Content wird hier injiziert -->
    <div id="root"><!--ssr-outlet--></div>

    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
