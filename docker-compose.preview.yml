# =============================================================================
# PolarisDX — Preview-Ueberlagerung (AP28 PT28.1, DEPLOYMENT-CONTRACT DEP-27..30)
# =============================================================================
# Wird nur zusammen mit docker-compose.yml und ueber `./deploy.sh` benutzt:
#
#   ./deploy.sh --env preview up <release>
#
# Unterschiede zur Produktion, alle ueber Konfiguration (D-T25):
#   - eigenes Compose-Projekt (`polarisdx-preview`) mit eigenem Volume — keine
#     geteilten Lead-Daten, kein Zugriff auf die Produktionscontainer;
#   - eigene Host-Ports (Standard 9100 / 5100, vhost preview.polarisdx.net);
#   - APP_ENV=preview: das Backend erzwingt den Trockenlauf, kein Provider-
#     Aufruf, auch nicht mit DRY_RUN=0 (AP22 PT22.8, D-T11);
#   - eigene Secrets-Datei `server/.env.preview` (DEP-28). Sie enthaelt keinen
#     produktiven SendGrid-Schluessel.
#
# Das Frontend-Image ist dasselbe Build-Profil wie in docker-compose.yml
# (VITE_APP_ENV=preview, Preview-GTM-Container). Die Nicht-Indexierbarkeit
# setzt der Host-nginx (`X-Robots-Tag: noindex, nofollow`, DEP-30/D-T12).
# =============================================================================

name: polarisdx-preview

services:
  frontend:
    ports: !override
      - '127.0.0.1:${WEB_HOST_PORT:-9100}:3000'

  backend:
    ports: !override
      - '127.0.0.1:${API_HOST_PORT:-5100}:5000'
    env_file: !override
      - ./server/.env.preview
    environment:
      - APP_ENV=preview
      - DRY_RUN=1

# Der Docker-Host hat keine freien Standard-Adressbereiche mehr (gemessen
# 2026-10-16: "all predefined address pools have been fully subnetted"). Jedes
# neue Projekt braucht deshalb ein ausdrueckliches Subnetz; andere Projekte auf
# dem Host verfahren genauso (10.213.x/28).
networks:
  app-network:
    ipam:
      config:
        - subnet: ${PREVIEW_SUBNET:-10.213.142.0/28}
