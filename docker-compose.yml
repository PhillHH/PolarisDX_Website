# =============================================================================
# PolarisDX — Compose-Zielstack (AP28, DEPLOYMENT-CONTRACT §5.1)
# =============================================================================
# Produktion und Preview laufen aus DIESER Datei; die Preview ergaenzt sie um
# `docker-compose.preview.yml` (APP_ENV=preview, eigene Ports, eigenes Projekt).
# Bedienung ausschliesslich ueber `./deploy.sh` (Runbook: docs/deploy.md):
#   - Images tragen den Git-SHA als Tag (RELEASE), nie `latest` (DEP-04/DEP-05).
#   - Host-Ports kommen aus der Umgebung, Standard = heutige Produktion
#     (DD-19, D-T25). Keine zweite Umgebung startet ohne eigene Ports.
#   - Ein Deploy gilt erst nach dem Health-Gate als angenommen (DEP-08).
# =============================================================================

services:
  # ==========================================================================
  # Frontend Service (Node.js SSR Server)
  # ==========================================================================
  frontend:
    image: polarisdx-frontend:${RELEASE:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # SC-011 (Owner 2026-10-19): EIN Image fuer Preview und Produktion. Gebaut
        # wird mit dem Container, den die Produktion misst (GTM-PL26PFFH ->
        # GA4 G-Z1SBW4CJFP, Owner-Wahl). Die Preview misst nicht: ihr Frontend
        # bekommt APP_ENV=preview (docker-compose.preview.yml), der SSR-Server
        # schreibt das als <meta name="polaris-app-env"> und analyticsConfig.ts
        # unterdrueckt dort jeden Container (kein *_PREVIEW-Container gesetzt).
        VITE_APP_ENV: production
        VITE_GTM_CONTAINER_ID: GTM-PL26PFFH
        # Release-Identitaet bis zum Git-SHA (DEP-04, D-T2): landet als
        # OCI-Label im Image; `deploy.sh` vergleicht es nach dem Start.
        GIT_SHA: ${RELEASE:-local}

    ports:
      # Externer Host-nginx -> Container. Port aus der Umgebung (DD-19); der
      # Standard ist der produktive vhost `polarisdx.net` -> 127.0.0.1:2026.
      - '127.0.0.1:${WEB_HOST_PORT:-2026}:3000'

    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:5000 # Docker-Netzwerk DNS
      # Im Container muss der SSR-Dienst auf allen Interfaces hoeren, sonst ist
      # er hinter dem Portmapping unerreichbar (DD-18). Ausserhalb des
      # Containers bleibt der Standard Loopback.
      - LISTEN_HOST=0.0.0.0
      # SC-011: Laufzeit-Umgebung fuer <meta name="polaris-app-env"> (Analytics).
      - APP_ENV=${APP_ENV:-production}

    # Startreihenfolge ist kein Bereitschaftsnachweis (DEP-49, DD-16): das Web
    # startet erst, wenn das Backend seine Datenbank lesen kann.
    depends_on:
      backend:
        condition: service_healthy

    # Healthcheck steht im Dockerfile (SSR rendert /de/). Hier nur die
    # Log-Rotation (DEP-51): stdout bleibt die Quelle, die Platte laeuft nicht voll.
    logging: &default-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

    networks:
      - app-network

    restart: unless-stopped

  # ==========================================================================
  # Backend Service (Node.js API / Mailer)
  # ==========================================================================
  backend:
    image: polarisdx-backend:${RELEASE:-local}
    build:
      context: ./server
      dockerfile: Dockerfile
      # Geschuetzte Lead-Magnet-Dateien liegen ausserhalb von server/ (storage/protected).
      # Sie gehoeren ins Image, damit das Release vollstaendig und unveraenderlich ist —
      # ohne sie scheitert der gegatete Download im Container (gemessen 2026-10-16).
      additional_contexts:
        protected: ./storage/protected
      args:
        GIT_SHA: ${RELEASE:-local}

    ports:
      # Begruendete Host-Veroeffentlichung (M-09, DD-15): der produktive
      # Host-nginx leitet `/api/early-access` direkt an 127.0.0.1:5000 weiter
      # (Early-Access-Seiten liegen ausserhalb dieses Repos). Das Web erreicht
      # das Backend dagegen nur ueber das interne Netz. Early-Access ist seit
      # 2026-10-16 stillgelegt (SC-004): beim Cutover erst den nginx-Eintrag
      # entfernen, dann diesen Port streichen (docs/deploy.md §3).
      - '127.0.0.1:${API_HOST_PORT:-5000}:5000'

    env_file:
      - ./server/.env

    environment:
      # Umgebung ausdruecklich deklariert (DEP-29, LDC-24). Die Preview-Datei
      # setzt `preview` — damit erzwingt das Backend den Trockenlauf.
      - APP_ENV=${APP_ENV:-production}
      - LEAD_DB_PATH=/var/lib/polarisdx/leads.sqlite3

      # AP22-CLOSURE:
      # Support-Anhaenge liegen auf Platte, die Datenbank haelt nur ihre
      # Metadaten.
      #
      # Ohne diese Zeile landeten sie im Default
      # (/app/server/storage/support-uploads) und damit auf der
      # veraenderlichen Container-Schicht.
      #
      # Ein Redeploy koennte die Dateien loeschen, waehrend die Lead-Zeile
      # weiterhin Anhaenge referenziert.
      #
      # Deshalb liegen Uploads auf demselben persistenten Volume wie die
      # Lead-Datenbank.
      - SUPPORT_UPLOAD_DIR=/var/lib/polarisdx/support-uploads

    volumes:
      - lead-data:/var/lib/polarisdx

    # Anwendungsnah (DEP-46): Anfrageverarbeitung plus lesbare Lead-Datenbank,
    # ohne Nebenwirkung (DEP-48). Wird unhealthy, wenn das Volume fehlt.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging: *default-logging

    networks:
      - app-network

    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge

# =============================================================================
# Persistent Volumes
# =============================================================================
volumes:
  lead-data:
