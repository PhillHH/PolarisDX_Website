<!doctype html>
<!--
  Standard-Share-Karte (public/og-image.jpg, 1200×630) — AP34 / SC-002 „Editorial".
  Gerendert von scripts/make-og-card.mjs; die Platzhalter {{…}} setzt das Skript.

  Nur echte Assets und freigegebene Aussagen:
  - Logo: src/assets/polaris_white.webp (Original-Lockup, keine nachgesetzte Wortmarke)
  - Gerät: src/assets/Igloo-pro-frontal.png (offizieller Produktrender, kein gezeichnetes Gerät,
    kein Messwert auf dem Display)
  - Texte: home.json `hero.title`, `hero.caption`, `trustbar.*` — Claim-Register HCL-001..005
  Farben nur aus der Palette (Guard: npm run check:colors).
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('{{FONT}}') format('woff2');
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        background: #083358;
        color: #ffffff;
      }
      .ring {
        position: absolute;
        right: -120px;
        top: -70px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(circle, #0d527f 0%, #083358 70%);
      }
      .dots {
        position: absolute;
        right: 20px;
        top: 70px;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        border: 3px dotted #02a6e3;
        opacity: 0.55;
      }
      .left {
        position: relative;
        z-index: 1;
        width: 690px;
        padding: 56px 0 52px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .logo {
        height: 30px;
        display: block;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid #ffffff40;
        font-size: 17px;
        font-weight: 600;
      }
      .eyebrow i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #02a6e3;
      }
      h1 {
        margin-top: 26px;
        font-size: 64px;
        line-height: 1.02;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      h1 span {
        display: block;
      }
      h1 span:last-child {
        color: #8fd8fb;
      }
      .signals {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .signals span {
        padding: 8px 14px;
        border-radius: 999px;
        background: #ffffff;
        color: #083358;
        font-size: 15px;
        font-weight: 600;
      }
      .domain {
        margin-top: 18px;
        font-size: 17px;
        font-weight: 500;
        color: #8fd8fb;
      }
      .right {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-right: 40px;
      }
      .right img {
        width: 360px;
        display: block;
        filter: drop-shadow(0 28px 40px #0a3f63);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ring"></div>
      <div class="dots"></div>
      <div class="left">
        <img class="logo" src="{{LOGO}}" alt="PolarisDX" />
        <div>
          <span class="eyebrow"><i></i>{{CAPTION}}</span>
          <h1>{{TITLE}}</h1>
        </div>
        <div>
          <div class="signals">{{SIGNALS}}</div>
          <div class="domain">polarisdx.net</div>
        </div>
      </div>
      <div class="right"><img src="{{DEVICE}}" alt="IglooPro" /></div>
    </div>
  </body>
</html>
